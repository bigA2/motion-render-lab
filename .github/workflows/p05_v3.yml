# P05 v3 production ad (src/p05_v3): 4:5 (1080x1350) + 5:4 (1350x1080), 14.0 s, no voice, SFX-led with a low CC0 bed.
# stills -> guarded render in parts per format -> join + master (-14 LUFS, TP <= -1) + SFX-only master -> layout guard
# (text overlap / safe area / size / contrast / text over mockups; FAILS on any violation) -> 4 fps contact sheets with
# SFX marks -> ebur128. Renders ONLY here. Artifact: P05_v3. QA images -> branch qa/p05_v3.
name: p05_v3
permissions: { contents: write }
on:
  workflow_dispatch:
    inputs:
      rev: { description: 'label for the QA folder', required: false, default: 'r1' }
      parts: { description: 'render parts per format', required: false, default: '4' }
env: { ENTRY: src/p05_v3/index.ts }
jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: node tools/p05_v3/stills.mjs stills 50,130,200,240,330,400,470,540,600,690,800 P05V3-4x5 P05V3-5x4
      - uses: actions/upload-artifact@v4
        with: { name: 'stills', path: stills/, retention-days: 3 }
  setup:
    needs: stills
    runs-on: ubuntu-latest
    outputs: { r: '${{ steps.m.outputs.r }}' }
    steps:
      - id: m
        run: python3 -c "import json; n=int('${{ inputs.parts }}'); print('r=' + json.dumps({'include':[{'fmt':f,'comp':c,'part':p,'n':n} for f,c in (('4x5','P05V3-4x5'),('5x4','P05V3-5x4')) for p in range(n)]}))" >> $GITHUB_OUTPUT
  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy: { fail-fast: false, matrix: '${{ fromJSON(needs.setup.outputs.r) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: P=${{ matrix.part }}; node tools/p05_07/render_guarded.mjs "${{ matrix.comp }}" "part$P.mp4" "tg$P.json" "$P/${{ matrix.n }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 'part-${{ matrix.fmt }}-${{ matrix.part }}'
          retention-days: 2
          path: |
            part${{ matrix.part }}.mp4
            tg${{ matrix.part }}.json
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install --quiet numpy
      - run: npx -y tsx@4.19.2 src/p05_v3/dump.ts && python3 tools/p05_v3/mix.py out/events_P05V3.json out/audio
      - uses: actions/upload-artifact@v4
        with: { name: 'audio-P05V3', path: 'out/', retention-days: 3 }
  join:
    needs: [setup, render, audio]
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { fmt: ['4x5', '5x4'] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install --quiet numpy pillow
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'part-${{ matrix.fmt }}-*', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: 'audio-P05V3', path: aud }
      - name: join + masters + QA sheets
        run: |
          N=P05_v3_${{ matrix.fmt }}; K=$(ls parts/part*.mp4 | wc -l)
          for p in $(seq 0 $((K - 1))); do echo "file 'parts/part$p.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy video.mp4
          mkdir -p final qa
          python3 tools/p05_v3/master.py video.mp4 aud/audio/music_sfx.wav "final/FansaChat_${N}.mp4" aud/audio/sfx_only.wav aud/audio/music_only.wav "qa/${N}_bed.json" | tee "qa/${N}_master.txt"
          python3 tools/p05_v3/master.py video.mp4 aud/audio/sfx_only.wav "final/FansaChat_${N}_SFX-only.mp4" | tee -a "qa/${N}_master.txt"
          python3 tools/p05_07/qa.py "final/FansaChat_${N}.mp4" aud/audio/sfx_report.json qa "$N"
          for v in "final/FansaChat_${N}.mp4" "final/FansaChat_${N}_SFX-only.mp4"; do echo "== $v" >> "qa/${N}_ebur128.txt"; ffmpeg -hide_banner -i "$v" -af ebur128=peak=true -f null - 2>&1 | tail -12 >> "qa/${N}_ebur128.txt"; done
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of compact "final/FansaChat_${N}.mp4" > "qa/${N}_probe.txt"
          echo "### ${N}" >> $GITHUB_STEP_SUMMARY; cat "qa/${N}_master.txt" "qa/${N}_probe.txt" >> $GITHUB_STEP_SUMMARY
      - name: layout guard (every 4th frame)
        run: |
          set +e; N=P05_v3_${{ matrix.fmt }}
          node tools/p05_07/layout_guard.mjs video.mp4 "qa/guard/${N}_layout_guard.json" 0 parts/tg*.json 2>&1 | tee "qa/${N}_layout_guard.txt"
          R=${PIPESTATUS[0]}
          cp "qa/guard/${N}_layout_guard.json" final/
          head -3 "qa/${N}_layout_guard.txt" >> $GITHUB_STEP_SUMMARY
          exit $R
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'final-${{ matrix.fmt }}', path: final/, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'qa-${{ matrix.fmt }}', path: qa/, retention-days: 7 }
  collect:
    needs: [join]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: pub, pattern: 'final-*', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: 'audio-P05V3', path: aud }
      - run: mkdir -p pub/stems && cp aud/audio/*.wav aud/audio/sfx_report.json pub/stems/ && ls -laR pub
      - uses: actions/upload-artifact@v4
        with: { name: 'P05_v3', path: pub/, retention-days: 30 }
  qa:
    needs: [join]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: qa_in, pattern: 'qa-*', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: 'stills', path: qa_in/stills }
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          D="P05_v3_${{ inputs.rev }}"; [ -d qa_in ] || { echo "no QA artifacts"; exit 1; }
          mv qa_in /tmp/qa_in
          for i in 1 2 3 4 5; do
            if git fetch -q origin qa/p05_v3; then git checkout -qf -B qa/p05_v3 origin/qa/p05_v3; else git checkout -q --orphan qa/p05_v3; git rm -rqf --cached . || true; fi
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name 'P05_v3_*' -exec rm -rf {} +
            rm -rf "$D"; mkdir -p "$D" && cp -r /tmp/qa_in/* "$D/"
            echo "run ${{ github.run_id }} rev=${{ inputs.rev }} sha=${{ github.sha }}" > "$D/RUN.txt"
            git add -A "$D" && git commit -qm "QA $D (run ${{ github.run_id }})" && git push -q origin HEAD:qa/p05_v3 && break
            sleep $((i * 5))
          done
