# P01 "Stop copying leads by hand" (9:16, 30 fps). Storyboard stills + contact sheet for founder review.
name: p01
permissions: { contents: read }
on:
  workflow_dispatch:
    inputs:
      secs: { description: 'still times (s), sheet order', required: false, default: '0.5 2.5 6 10 14 18 23 28' }
      extra: { description: 'extra check stills (s), not on the sheet', required: false, default: '8.5' }
      comps: { description: 'stills: compositions to render (space separated)', required: false, default: 'P01-4x5 P01-16x9' }
      mode: { description: 'stills | voice (Chatterbox takes + Whisper pick -> vo-P01) | full (4x5 + 16x9 with VO + SFX, music and no-music) | video (silent 1080x1920 mp4 + half-size preview)', required: false, default: 'stills' }
jobs:
  voice:
    if: inputs.mode == 'voice'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts==0.1.7
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-std-v1 }
      - env: { CB_THREADS: '4' }
        run: |
          python scripts/mkjobs.py P01
          python - <<'EOF'
          import json
          j=json.load(open("voices/jobs/P01.json")); s=${{ matrix.shard }}
          json.dump([x for i,x in enumerate(j) if i%4==s],open("shard.json","w"))
          EOF
          python voices/cb_std_batch.py shard.json
      - uses: actions/upload-artifact@v4
        with: { name: 'voice-P01-${{ matrix.shard }}', path: out/, retention-days: 1 }
  pick:
    needs: voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet faster-whisper==1.1.1 numpy requests && sudo apt-get -qq install -y ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: { path: gen, pattern: 'voice-P01-*', merge-multiple: true }
      - run: python scripts/pick.py P01
      - uses: actions/upload-artifact@v4
        with: { name: 'vo-P01', path: 'public/v/P01/', retention-days: 7 }
  render:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { fmt: ['4x5', '16x9'], part: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: |
          C="P01-${{ matrix.fmt }}"; K=6; P=${{ matrix.part }}
          npx remotion compositions src/p01/index.ts > comps.txt 2>&1 || (cat comps.txt; exit 1)
          N=$(grep -E "^[[:space:]]*$C[[:space:]]" comps.txt | grep -oE "[0-9]+ \([0-9.]+ sec\)" | grep -oE "^[0-9]+" | head -1)
          A=$(( N * P / K )); B=$(( N * (P + 1) / K - 1 ))
          npx remotion render src/p01/index.ts "$C" "part$P.mp4" --frames=$A-$B --muted --crf=16 --pixel-format=yuv420p --concurrency=100% --log=error --timeout=120000
          if [ "$P" = "0" ]; then npx remotion render src/p01/index.ts "$C" audio.wav --codec=wav --log=error --timeout=120000; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'part-${{ matrix.fmt }}-${{ matrix.part }}', path: 'part${{ matrix.part }}.mp4', retention-days: 1 }
      - if: matrix.part == 0
        uses: actions/upload-artifact@v4
        with: { name: 'audio-${{ matrix.fmt }}', path: audio.wav, retention-days: 1 }
  join:
    needs: render
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { fmt: ['4x5', '16x9'] } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null && pip install --quiet numpy pillow
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'part-${{ matrix.fmt }}-*', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: 'audio-${{ matrix.fmt }}', path: . }
      - run: |
          for p in 0 1 2 3 4 5; do echo "file 'parts/part$p.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy video.mp4
          mkdir -p out qa f
          B="out/FansaChat_P01_leads-to-crm_${{ matrix.fmt }}"
          # A: voice + SFX, no music
          ffmpeg -v error -i video.mp4 -i audio.wav -map 0:v -map 1:a -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=9 -ar 48000 -c:a aac -b:a 192k -shortest "${B}_no-music.mp4"
          # B: + CC0 music bed ~15 dB under the voice, side-chain ducked while the voice speaks
          M="public/audio/01_upbeat-tech_high-technologic-beat-explosion_loyalty-freak-music.mp3"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 audio.wav); FO=$(python3 -c "print(max(0.0, float('$D') - 2.5))")
          ffmpeg -v error -i video.mp4 -i audio.wav -stream_loop -1 -i "$M" -filter_complex "[1:a]aresample=48000,loudnorm=I=-14:TP=-1.5:LRA=9,asplit=2[v][sc];[2:a]aresample=48000,atrim=0:$D,asetpts=PTS-STARTPTS,afade=t=in:d=1,afade=t=out:st=$FO:d=2.5,loudnorm=I=-29:TP=-6:LRA=7[m];[m][sc]sidechaincompress=threshold=0.04:ratio=4:attack=25:release=400[md];[v][md]amix=inputs=2:duration=first:normalize=0,loudnorm=I=-14:TP=-1.5:LRA=9[a]" -map 0:v -map "[a]" -c:v copy -ar 48000 -c:a aac -b:a 192k -shortest "${B}_music.mp4"
          for v in no-music music; do ffmpeg -hide_banner -i "${B}_${v}.mp4" -af ebur128=peak=true -f null - 2>&1 | tail -12 > "qa/loudness_${v}.txt"; done
          ffmpeg -v error -i "${B}_no-music.mp4" -vf "fps=4,scale=360:-2" f/%04d.png
          python3 scripts/i27_qa.py f qa || true
      - uses: actions/upload-artifact@v4
        with: { name: 'final-P01-${{ matrix.fmt }}', path: out/*.mp4, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: 'qa-P01-${{ matrix.fmt }}', path: qa/, retention-days: 7 }
  video:
    if: inputs.mode == 'video'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: mkdir -p out && npx remotion render src/p01/index.ts P01 out/P01_9x16_silent.mp4 --muted --crf=16 --pixel-format=yuv420p --concurrency=100% --log=error --timeout=120000
      - run: npx remotion ffmpeg -y -loglevel error -i out/P01_9x16_silent.mp4 -vf scale=540:960 -c:v libx264 -crf 22 -pix_fmt yuv420p out/P01_preview_540.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video-P01, path: out/, retention-days: 7 }
  stills:
    if: inputs.mode == 'stills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure && pip install --quiet pillow
      - run: |
          mkdir -p stills
          for c in ${{ inputs.comps }}; do for s in ${{ inputs.secs }} ${{ inputs.extra }}; do
            F=$(python3 -c "import sys; print(round(float(sys.argv[1])*30))" "$s")
            echo "still $c $s (frame $F)"
            npx remotion still src/p01/index.ts "$c" "stills/${c}_${s}s.png" --frame=$F --log=error --timeout=120000 || echo "fail $c $s"
          done; done
      - name: contact sheets (one per composition, thumbs sized from the real frames)
        env: { SECS: '${{ inputs.secs }}', COMPS: '${{ inputs.comps }}' }
        run: |
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          ts = os.environ['SECS'].split()
          try: fnt = ImageFont.truetype('DejaVuSans.ttf', 30)
          except Exception: fnt = ImageFont.load_default()
          for c in os.environ['COMPS'].split():
              ps = [(t, f'stills/{c}_{t}s.png') for t in ts if os.path.exists(f'stills/{c}_{t}s.png')]
              if not ps: continue
              w0, h0 = Image.open(ps[0][1]).size; tw = 480; th = round(h0 * tw / w0); cols = 4
              rows = (len(ps) + cols - 1) // cols
              sheet = Image.new('RGB', (tw * cols + 50, (th + 50) * rows + 10), (20, 18, 26)); dr = ImageDraw.Draw(sheet)
              for i, (t, p) in enumerate(ps):
                  x, y = 10 + (i % cols) * (tw + 10), 10 + (i // cols) * (th + 50)
                  sheet.paste(Image.open(p).convert('RGB').resize((tw, th), Image.LANCZOS), (x, y + 40))
                  dr.text((x, y + 2), f'{c} {t} s', fill=(230, 230, 240), font=fnt)
              sheet.save(f'stills/SHEET_{c}.jpg', quality=90)
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: stills-P01, path: stills/, retention-days: 3 }
