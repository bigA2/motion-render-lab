# Study videos downloaded locally (YouTube blocks runners): uploaded to a release ->
# word-timed transcript + 2 s frame sheets + scene-cut sheets at high res. Outputs = artifacts only.
# Run: push study/enc_trigger.txt = "<release tag> <id> <id> ..." (workflow_dispatch needs the file on main).
name: study-enc
permissions: { contents: read }
on:
  push: { paths: ['study/enc_trigger.txt'] }
jobs:
  ids:
    runs-on: ubuntu-latest
    outputs: { list: '${{ steps.r.outputs.list }}', tag: '${{ steps.r.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          echo "tag=$(awk '{print $1}' study/enc_trigger.txt)" >> "$GITHUB_OUTPUT"
          echo "list=$(python3 -c 'import json;print(json.dumps(open("study/enc_trigger.txt").read().split()[1:]))')" >> "$GITHUB_OUTPUT"
  study:
    needs: ids
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy: { fail-fast: false, matrix: { id: '${{ fromJson(needs.ids.outputs.list) }}' } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper
      - name: Fetch
        env: { GH_TOKEN: '${{ github.token }}', ID: '${{ matrix.id }}' }
        run: |
          mkdir -p in out/sheets out/cuts
          gh release download "${{ needs.ids.outputs.tag }}" -R "$GITHUB_REPOSITORY" -p "$ID.mkv" -O video.mkv
          ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of compact video.mkv | tee out/info.txt
      - name: Project files from the description (public Drive folder, if listed)
        if: always()
        env: { ID: '${{ matrix.id }}' }
        run: |
          [ -f "study/drive_$ID.txt" ] || exit 0
          pip install -q gdown && mkdir -p out/project_files
          python -m gdown --folder "$(head -1 study/drive_$ID.txt)" -O out/project_files --remaining-ok || true
          find out/project_files -type f -size +300M -delete; find out/project_files -type f | sed 's#^#  #' > out/project_files_list.txt; cat out/project_files_list.txt
      - name: Transcript (word-timed)
        if: always()
        run: |
          ffmpeg -v error -i video.mkv -ac 1 -ar 16000 a.wav
          python3 - <<'PY'
          import wave, numpy as np
          from faster_whisper import WhisperModel as M
          w = wave.open('a.wav'); a = np.frombuffer(w.readframes(w.getnframes()), np.int16).astype(np.float32) / 32768
          segs, _ = M('small.en', device='cpu', compute_type='int8').transcribe(a, word_timestamps=True, vad_filter=True)
          with open('out/transcript.txt', 'w') as f:
              for s in segs:
                  f.write(f'[{int(s.start//60):02d}:{s.start%60:05.2f}] {s.text.strip()}\n')
          PY
      - name: Frame sheets (every 2 s) + scene cuts
        if: always()
        run: |
          ffmpeg -v error -i video.mkv -vf "fps=0.5,scale=480:-2,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=18:fontcolor=red:box=1:boxcolor=white@0.7,tile=5x6:padding=4:color=white" out/sheets/s_%03d.jpg
          ffmpeg -v error -i video.mkv -vf "select='gt(scene,0.28)',scale=640:-2,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=20:fontcolor=red:box=1:boxcolor=white@0.7" -vsync vfr out/cuts/c_%04d.jpg
          ls out/cuts | wc -l
          ffmpeg -v error -pattern_type glob -i 'out/cuts/c_*.jpg' -vf "tile=4x5:padding=4:color=white" out/cuts_%03d.jpg && rm -rf out/cuts
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'study-${{ matrix.id }}', path: out, retention-days: 7 }
