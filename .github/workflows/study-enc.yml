# Study videos downloaded locally (YouTube blocks runners): encrypted parts on a release (key = STUDY_KEY2 secret) ->
# decrypt -> word-timed transcript + 2 s frame sheets + scene-cut sheets at high res. Outputs = artifacts only.
# Run: gh workflow run study-enc.yml -f tag=study-wl3 -f ids="ruTR7i1oJgg Aa_T1uI4UXY"
name: study-enc
permissions: { contents: read }
on:
  workflow_dispatch:
    inputs:
      tag: { required: true }
      ids: { required: true }
jobs:
  ids:
    runs-on: ubuntu-latest
    outputs: { list: '${{ steps.r.outputs.list }}' }
    steps:
      - id: r
        run: echo "list=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1].split()))' '${{ inputs.ids }}')" >> "$GITHUB_OUTPUT"
  study:
    needs: ids
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy: { fail-fast: false, matrix: { id: '${{ fromJson(needs.ids.outputs.list) }}' } }
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper
      - name: Fetch + decrypt
        env: { GH_TOKEN: '${{ github.token }}', K: '${{ secrets.STUDY_KEY2 }}', ID: '${{ matrix.id }}' }
        run: |
          mkdir -p in out/sheets out/cuts
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -p "$ID.enc.part*" -D in
          cat in/$ID.enc.part* | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -out video.mkv
          rm -rf in; ffprobe -v error -show_entries stream=width,height,r_frame_rate:format=duration -of compact video.mkv | tee out/info.txt
      - name: Transcript (word-timed)
        run: |
          ffmpeg -v error -i video.mkv -ac 1 -ar 16000 a.wav
          python3 - <<'PY'
          from faster_whisper import WhisperModel as M
          segs, _ = M('small.en', device='cpu', compute_type='int8').transcribe('a.wav', word_timestamps=True, vad_filter=True)
          with open('out/transcript.txt', 'w') as f:
              for s in segs:
                  f.write(f'[{int(s.start//60):02d}:{s.start%60:05.2f}] {s.text.strip()}\n')
          PY
      - name: Frame sheets (every 2 s) + scene cuts
        run: |
          ffmpeg -v error -i video.mkv -vf "fps=0.5,scale=480:-2,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=18:fontcolor=red:box=1:boxcolor=white@0.7,tile=5x6:padding=4:color=white" out/sheets/s_%03d.jpg
          ffmpeg -v error -i video.mkv -vf "select='gt(scene,0.28)',scale=640:-2,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=20:fontcolor=red:box=1:boxcolor=white@0.7" -vsync vfr out/cuts/c_%04d.jpg
          ls out/cuts | wc -l
          ffmpeg -v error -pattern_type glob -i 'out/cuts/c_*.jpg' -vf "tile=4x5:padding=4:color=white" out/cuts_%03d.jpg && rm -rf out/cuts
      - uses: actions/upload-artifact@v4
        with: { name: 'study-${{ matrix.id }}', path: out, retention-days: 7 }
