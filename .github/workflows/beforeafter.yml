# Render the FansaChat before/after posts (beforeafter/build.py) and upload them as artifact "beforeafter".
name: beforeafter
on:
  workflow_dispatch:
  push:
    branches: [images/before-after-2026-11-21]
    paths: ['beforeafter/build.py', 'glass5/**', '.github/workflows/beforeafter.yml']
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install playwright pillow && playwright install --with-deps chromium
      - run: python beforeafter/build.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beforeafter
          retention-days: 14
          path: |
            beforeafter/out/*.png
            beforeafter/out/QA.txt
