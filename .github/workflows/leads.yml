name: leads
# Overnight lead collection. No AI, no secrets. Output is encrypted to tools/leads/pubkey.pem;
# only the founder's PC holds the private key, so the artifact is unreadable to anyone else.
on:
  workflow_dispatch:
    inputs:
      target:
        description: how many qualified leads to keep
        default: '500'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.5
      - run: python tools/leads/collect.py
        env:
          TARGET: ${{ inputs.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: leads-encrypted
          path: out/
          retention-days: 3
