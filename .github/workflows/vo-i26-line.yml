# Regenerate ONE I26 voice line (same Chatterbox female narrator + settings as intro26.yml), Whisper-pick the best take.
# Run: gh workflow run vo-i26-line.yml --ref <branch> -f line=5   -> artifact vo-line (NN.wav + vo_line.json)
name: vo-i26-line
permissions: { contents: read }
on:
  push: { branches: ['wave1/intro-v7'], paths: ['.github/workflows/vo-i26-line.yml'] }
  workflow_dispatch:
    inputs:
      line: { description: '1-based line number in src/intro26/I26.json', required: false, default: '5' }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts==0.1.7
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-std-v1 }
      - env: { CB_THREADS: '4' }
        run: |
          cp src/intro26/I26.json src/specs/I26.json
          python scripts/mkjobs.py I26
          python - <<'EOF2'
          import json, copy
          L=int("${{ inputs.line || 5 }}"); s=${{ matrix.shard }}
          j=[x for x in json.load(open("voices/jobs/I26.json")) if x["out"].split("/")[-1].startswith(f"{L:02d}_take")]
          extra=[]
          for x in j:
              for seed in (3,4,5,6):
                  y=copy.deepcopy(x); y["seed"]=seed; y["out"]=y["out"].replace("take1",f"take{seed}").replace("take2",f"take{seed}"); extra.append(y)
          allj={x["out"]:x for x in j+extra}.values()
          json.dump([x for i,x in enumerate(allj) if i%3==s],open("shard.json","w"))
          EOF2
          python voices/cb_std_batch.py shard.json
      - uses: actions/upload-artifact@v4
        with: { name: 'voice-line-${{ matrix.shard }}', path: out/, retention-days: 1 }
  pick:
    needs: voice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet faster-whisper==1.1.1 numpy requests && sudo apt-get -qq install -y ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: { path: gen, pattern: 'voice-line-*', merge-multiple: true }
      - run: cp src/intro26/I26.json src/specs/I26.json && python scripts/pick.py I26 ${{ inputs.line || 5 }}
      - uses: actions/upload-artifact@v4
        with: { name: 'vo-line', path: 'public/v/I26/', retention-days: 3 }
