# Render the 5 glass promo images (glass5/build.py) with Playwright + QA. Free on public runners.
name: glass5
on:
  workflow_dispatch:
    inputs: { script: { default: build.py } }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright pillow potracer numpy && playwright install --with-deps chromium
      - run: python glass5/${{ inputs.script }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass5
          retention-days: 7
          path: |
            glass5/out/*.png
            glass5/out/*.md
      - if: always()
        run: cat glass5/out/QA*.txt || true
