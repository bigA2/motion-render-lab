# P05 v5 test shot 4b (src/p05_v5/Shot4b.tsx) = test shot 4 + addendum 9-11 (animated ice/steel field, a null-zoom close-up per
# new element, the field morphs to a new colourway on each null zoom): 5:4 1350x1080, 11.33 s, 30 fps. Shot 4 as below: Hook on a typographic grid -> Chrome window on an
# ice/steel field -> liquid glass prompt box (neon border) typed -> box shrinks into the real sent chat bubble -> real builder
# states (picker -> reading -> flow connects + "What goes where") -> Notion node opens into the real Notion page -> real Slack.
# Draft (greyscale + grid) + final, breakdown, 12 fps sheet + every 12 fps frame (for the frame-by-frame check), key sheet,
# audio mastered to -14 LUFS. Artifact P05_v5_test4b, Pages /p05_test4b/. Does not touch earlier test shots.
name: p05_v5_t4b
permissions: { contents: write }
on: { workflow_dispatch: {} }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: (command -v ffmpeg >/dev/null || (sudo timeout 300 apt-get -qq update && sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get -qq install -y ffmpeg >/dev/null)) && ffmpeg -version | head -1
      - name: render draft + final
        run: |
          mkdir -p out
          npx remotion render src/p05_v5/index.tsx P05V5T4B-draft out/P05_v5_test4b_draft.mp4 --codec h264 --crf 18 --muted --concurrency 4
          npx remotion render src/p05_v5/index.tsx P05V5T4B out/raw.mp4 --codec h264 --crf 14 --audio-codec aac --audio-bitrate 320k --concurrency 4
      - name: master to -14 LUFS (gain search into a -2 dB limiter)
        run: |
          cd out
          python3 - <<'PY'
          import re, subprocess
          def chain(g): return "volume=%.2fdB,alimiter=limit=0.79:attack=0.5:release=40:level=false" % g
          def meas(g):
              r = subprocess.run(['ffmpeg','-hide_banner','-i','raw.mp4','-t','11.34','-af',chain(g)+',ebur128=peak=true','-f','null','-'], capture_output=True, text=True).stderr
              s = r[r.rindex('Summary:'):]
              return float(re.search(r'I:\s+(-?[\d.]+) LUFS', s).group(1)), float(re.search(r'Peak:\s+(-?[\d.]+) dBFS', s).group(1))
          lo, hi = 0.0, 30.0
          for _ in range(14):
              g = (lo + hi) / 2; i, tp = meas(g)
              print('gain %.2f -> I %.2f LUFS, TP %.2f' % (g, i, tp))
              if abs(i + 14) < 0.1: break
              lo, hi = (g, hi) if i < -14 else (lo, g)
          open('chain.txt', 'w').write(chain(g))
          PY
          ffmpeg -v error -y -i raw.mp4 -t 11.34 -af "$(cat chain.txt),aresample=48000" -c:v copy -c:a aac -b:a 256k FansaChat_P05_v5_test4b_5x4.mp4
          cat chain.txt; rm raw.mp4 chain.txt
      - name: breakdown, sheets, frames, loudness
        run: |
          cd out
          F=FansaChat_P05_v5_test4b_5x4.mp4
          ffmpeg -v error -y -i $F -i P05_v5_test4b_draft.mp4 -filter_complex "[0:v]scale=676:540[a];[1:v]scale=676:540[b];[a][b]vstack" -map 0:a -c:v libx264 -crf 18 -pix_fmt yuv420p P05_v5_test4b_breakdown.mp4
          ffmpeg -v error -y -i $F -vf "fps=12,scale=338:-1,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=14:fontcolor=yellow:box=1:boxcolor=black@0.5,tile=8x17" -frames:v 1 P05_v5_test4b_sheet12.jpg
          ffmpeg -v error -y -i $F -vf "select='eq(n\,10)+eq(n\,60)+eq(n\,100)+eq(n\,140)+eq(n\,150)+eq(n\,158)+eq(n\,166)+eq(n\,174)+eq(n\,182)+eq(n\,192)+eq(n\,204)+eq(n\,214)+eq(n\,226)+eq(n\,234)+eq(n\,244)+eq(n\,250)+eq(n\,262)+eq(n\,274)+eq(n\,284)+eq(n\,296)+eq(n\,306)+eq(n\,314)+eq(n\,326)+eq(n\,338)',scale=675:-1,drawtext=text='f%{n}':x=8:y=8:fontsize=22:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=4x6" -vsync vfr -frames:v 1 P05_v5_test4b_keys.jpg
          mkdir -p f12 d12
          ffmpeg -v error -y -i $F -vf "fps=12,scale=675:-1" -q:v 3 f12/f12_%03d.jpg
          ffmpeg -v error -y -i P05_v5_test4b_draft.mp4 -vf "fps=4,scale=1350:-1" -q:v 3 d12/d4_%03d.jpg
          ffmpeg -hide_banner -i $F -af ebur128=peak=true -f null - 2>&1 | tail -12 > loudness.txt
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact $F > probe.txt
          cat probe.txt loudness.txt >> $GITHUB_STEP_SUMMARY; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: 'P05_v5_test4b', path: out/, retention-days: 30 }
      - name: publish to Pages /p05_test4b/
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp -r out /tmp/out
          for i in 1 2 3 4 5; do
            git fetch -q origin gh-pages && git checkout -qf -B gh-pages origin/gh-pages
            rm -rf p05_test4b && mkdir -p p05_test4b && cp -r /tmp/out/*.mp4 /tmp/out/*.jpg /tmp/out/*.txt /tmp/out/f12 /tmp/out/d12 p05_test4b/
            {
              echo '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>P05 test shot 4b</title>'
              echo '<style>body{background:#0c0b11;color:#e9e6f2;font:16px system-ui;margin:24px}video,img{max-width:100%;border-radius:10px;margin:8px 0}</style>'
              echo "<h2>P05 v5 - test shot 4b (5:4) - run ${{ github.run_id }}</h2>"
              echo '<video src="./FansaChat_P05_v5_test4b_5x4.mp4" controls playsinline loop width=675></video>'
              echo '<h3>Breakdown: final over draft (greyscale + typographic grid)</h3><video src="./P05_v5_test4b_breakdown.mp4" controls playsinline loop width=675></video>'
              echo '<h3>Key frames</h3><img src="./P05_v5_test4b_keys.jpg"><h3>12 fps sheet</h3><img src="./P05_v5_test4b_sheet12.jpg">'
              echo '<h3>Loudness</h3><pre>'; cat /tmp/out/loudness.txt; echo '</pre>'
            } > p05_test4b/index.html
            git add p05_test4b && git commit -qm "Pages: P05 v5 test shot 4b (run ${{ github.run_id }})" && git push -q origin gh-pages && break
            sleep $((i * 5))
          done
