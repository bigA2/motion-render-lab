name: rag-research
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/research/rag_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: rag-sources
          path: out/
          retention-days: 7
