# FansaChat introduction film (I26), free on public runners:
# voice (Chatterbox, 4 shards) -> Whisper pick -> render 16:9 + 4:5 in chunks (muted) + audio wav -> join + loudnorm -> QA sheets.
# Run: gh workflow run intro26.yml          (reuse voice: -f vo_run=<run id>)
name: intro26
permissions: { contents: read, actions: read }
on:
  workflow_dispatch:
    inputs:
      vo_run: { description: 'reuse picked vo artifact from this run id', required: false, default: '' }
      parts: { description: 'chunks per format', required: false, default: '[0,1,2,3,4,5]' }
jobs:
  voice:
    if: inputs.vo_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts==0.1.7
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: chatterbox-std-v1 }
      - env: { CB_THREADS: '4' }
        run: |
          cp src/intro26/I26.json src/specs/I26.json
          python scripts/mkjobs.py I26
          python - <<'EOF'
          import json
          j=json.load(open("voices/jobs/I26.json")); s=${{ matrix.shard }}
          json.dump([x for i,x in enumerate(j) if i%4==s],open("shard.json","w"))
          EOF
          python voices/cb_std_batch.py shard.json
      - uses: actions/upload-artifact@v4
        with: { name: 'voice-I26-${{ matrix.shard }}', path: out/, retention-days: 1 }
  pick:
    needs: voice
    if: inputs.vo_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet faster-whisper==1.1.1 numpy requests && sudo apt-get -qq install -y ffmpeg >/dev/null
      - uses: actions/download-artifact@v4
        with: { path: gen, pattern: 'voice-I26-*', merge-multiple: true }
      - run: cp src/intro26/I26.json src/specs/I26.json && python scripts/pick.py I26
      - uses: actions/upload-artifact@v4
        with: { name: 'vo-I26', path: 'public/v/I26/', retention-days: 3 }
  render:
    needs: pick
    if: always() && (needs.pick.result == 'success' || inputs.vo_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { fmt: ['16x9', '4x5'], part: '${{ fromJSON(inputs.parts) }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { name: 'vo-I26', path: 'public/v/I26', run-id: "${{ inputs.vo_run != '' && inputs.vo_run || github.run_id }}", github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - run: |
          C="I26-${{ matrix.fmt }}"
          npx remotion compositions src/intro26/index.ts > comps.txt 2>&1 || (cat comps.txt; exit 1)
          N=$(grep -E "^[[:space:]]*$C[[:space:]]" comps.txt | grep -oE "[0-9]+ \([0-9.]+ sec\)" | grep -oE "^[0-9]+" | head -1)
          K=$(python3 -c "print(len(${{ inputs.parts }}))"); P=${{ matrix.part }}
          A=$(( N * P / K )); B=$(( N * (P + 1) / K - 1 ))
          npx remotion render src/intro26/index.ts "$C" "part$P.mp4" --frames=$A-$B --muted --gl=swangle --concurrency=100% --crf=17 --log=error --timeout=120000
          if [ "$P" = "0" ]; then npx remotion render src/intro26/index.ts "$C" audio.wav --codec=wav --log=error --timeout=120000; else touch audio.wav; fi
      - uses: actions/upload-artifact@v4
        with: { name: 'part-${{ matrix.fmt }}-${{ matrix.part }}', path: 'part${{ matrix.part }}.mp4', retention-days: 1 }
      - if: matrix.part == 0
        uses: actions/upload-artifact@v4
        with: { name: 'audio-${{ matrix.fmt }}', path: audio.wav, retention-days: 1 }
  join:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { fmt: ['16x9', '4x5'] } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null && pip install --quiet numpy pillow
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'part-${{ matrix.fmt }}-*', merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: 'audio-${{ matrix.fmt }}', path: . }
      - name: Join + loudnorm (-14 LUFS, -1 dBTP)
        run: |
          for p in $(python3 -c "print(' '.join(str(x) for x in ${{ inputs.parts }}))"); do echo "file 'parts/part$p.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy video.mp4
          mkdir -p out
          ffmpeg -v error -i video.mp4 -i audio.wav -map 0:v -map 1:a -c:v copy -af loudnorm=I=-14:TP=-1:LRA=7 -ar 48000 -c:a aac -b:a 192k -shortest "out/FansaChat_Intro_${{ matrix.fmt }}.mp4"
          ffmpeg -hide_banner -i "out/FansaChat_Intro_${{ matrix.fmt }}.mp4" -af ebur128=peak=true -f null - 2>&1 | tail -12 > out/loudness_${{ matrix.fmt }}.txt
      - name: QA - 4 fps contact sheets + frame-difference pop scan
        run: |
          mkdir -p qa f
          ffmpeg -v error -i "out/FansaChat_Intro_${{ matrix.fmt }}.mp4" -vf "fps=4,scale=480:-2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='%{pts\:hms}':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.6" f/%04d.png
          python3 - <<'EOF'
          import glob, numpy as np
          from PIL import Image
          fs=sorted(glob.glob('f/*.png')); per=30
          for i in range(0,len(fs),per):
              ims=[Image.open(p) for p in fs[i:i+per]]; w,h=ims[0].size; cols=6; rows=(len(ims)+cols-1)//cols
              sheet=Image.new('RGB',(w*cols,h*rows),'white')
              for j,im in enumerate(ims): sheet.paste(im,((j%cols)*w,(j//cols)*h))
              sheet.save(f'qa/sheet_{i//per:02d}.jpg',quality=80)
          a=[np.asarray(Image.open(p).convert('L').resize((96,96)),np.float32) for p in fs]
          d=[float(np.abs(a[k+1]-a[k]).mean()) for k in range(len(a)-1)]
          out=[]
          for k in range(1,len(d)-1):
              nb=(d[k-1]+d[k+1])/2
              if d[k]>3*max(nb,1.0) and d[k]>8: out.append(f'pop? t={(k+1)/4:.2f}s diff={d[k]:.1f} neighbours={nb:.1f}')
          open('qa/popscan.txt','w').write('\n'.join(out) or 'no pops')
          print('\n'.join(out) or 'no pops')
          EOF
          cp out/loudness_${{ matrix.fmt }}.txt qa/
      - uses: actions/upload-artifact@v4
        with: { name: 'final-I26-${{ matrix.fmt }}', path: out/*.mp4, retention-days: 3 }
      - uses: actions/upload-artifact@v4
        with: { name: 'qa-I26-${{ matrix.fmt }}', path: qa/, retention-days: 3 }
