# Free-asset research on GitHub runners (no Claude, no local load). Trigger: push a change to research/trigger.txt.
name: assets-research
on:
  push:
    paths: ['research/trigger.txt']
permissions: { contents: write }
concurrency: { group: assets-research, cancel-in-progress: true }
jobs:
  mixkit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/mixkit_probe.py 400
      - run: |
          git config user.name bigA2; git config user.email "293160669+bigA2@users.noreply.github.com"
          git add research/MIXKIT_AE_REPORT.md research/mixkit_ae.json
          git commit -m "research: Mixkit AE convertibility report" && git pull --rebase -q && git push
