# Graph-lite: Activepieces community pieces source (MIT) -> typed app/trigger/action graph + retrieval eval. No AI.
name: graphlab-graph
on: { workflow_dispatch: {}, push: { branches: [tools/graphlab-graph] } }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: git clone --depth 1 --filter=blob:none --sparse https://github.com/activepieces/activepieces ap && git -C ap sparse-checkout set packages/pieces/community
      - run: cd graphlab && python graph/build_graph.py ../ap/packages/pieces/community && python graph/retrieve.py out/graph.json
      - uses: actions/upload-artifact@v4
        with: { name: graph-lite, path: graphlab/out/, retention-days: 14 }
