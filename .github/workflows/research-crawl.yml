# Market research crawl: public data only (APIs + Crawl4AI pages), no LLM, no secrets beyond the default token.
# Output: artifact "research-raw" (1 day). Analysis (Laya yes/no scoring) runs locally on the founder's PC.
# Run: gh workflow run research-crawl.yml --ref tools/templates
name: research-crawl
on: { workflow_dispatch: { inputs: { steps: { required: false, default: "hn,disc,n8n,aei,onet,gh" } } } }
permissions: { contents: read }
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python research/crawl.py out "${{ inputs.steps }}"
        env: { GH_TOKEN: '${{ github.token }}' }
      - uses: actions/upload-artifact@v4
        with: { name: research-api, path: out, retention-days: 1 }
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q crawl4ai==0.9.5 && python -m playwright install --with-deps chromium
      - run: python research/pages.py out
      - uses: actions/upload-artifact@v4
        with: { name: research-pages, path: out, retention-days: 1 }
