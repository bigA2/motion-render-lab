# P05 v5 test shot 2 (src/p05_v5/Shot2.tsx): 5:4 1350x1080, 4.5 s, 30 fps. Camera dives into the real composer (stills of
# our own app), types the prompt big, presses send, cuts to the real 'sent' still. Draft-first: B/W draft + final,
# breakdown (final over draft), 12 fps sheet, key-frame sheet, audio mastered to -14 LUFS (bisection on the gain into a -2 dB
# limiter, measured with ebur128; two-pass loudnorm fell back to dynamic mode on this sparse, peaky SFX mix).
# Publishes artifact P05_v5_test2 and Pages /p05_test2/. Does not touch p05_v4 or test shot 1.
name: p05_v5_t2
permissions: { contents: write }
on: { workflow_dispatch: {} }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - run: (command -v ffmpeg >/dev/null || (sudo timeout 300 apt-get -qq update && sudo DEBIAN_FRONTEND=noninteractive timeout 400 apt-get -qq install -y ffmpeg >/dev/null)) && ffmpeg -version | head -1
      - name: render draft + final
        run: |
          mkdir -p out
          npx remotion render src/p05_v5/index.tsx P05V5T2-draft out/P05_v5_test2_draft.mp4 --codec h264 --crf 18 --muted
          npx remotion render src/p05_v5/index.tsx P05V5T2 out/raw.mp4 --codec h264 --crf 14 --audio-codec aac --audio-bitrate 320k
      - name: master to -14 LUFS (gain search into a -2 dB limiter; loudnorm falls back to dynamic on this peaky mix)
        run: |
          cd out
          python3 - <<'PY'
          import re, subprocess
          def chain(g): return "volume=%.2fdB,alimiter=limit=0.79:attack=0.5:release=40:level=false" % g
          def meas(g):
              r = subprocess.run(['ffmpeg','-hide_banner','-i','raw.mp4','-t','4.5','-af',chain(g)+',ebur128=peak=true','-f','null','-'], capture_output=True, text=True).stderr
              s = r[r.rindex('Summary:'):]
              return float(re.search(r'I:\s+(-?[\d.]+) LUFS', s).group(1)), float(re.search(r'Peak:\s+(-?[\d.]+) dBFS', s).group(1))
          lo, hi = 0.0, 24.0
          for _ in range(14):
              g = (lo + hi) / 2; i, tp = meas(g)
              print('gain %.2f -> I %.2f LUFS, TP %.2f' % (g, i, tp))
              if abs(i + 14) < 0.1: break
              lo, hi = (g, hi) if i < -14 else (lo, g)
          open('chain.txt', 'w').write(chain(g))
          PY
          ffmpeg -v error -y -i raw.mp4 -t 4.5 -af "$(cat chain.txt),aresample=48000" -c:v copy -c:a aac -b:a 256k FansaChat_P05_v5_test2_5x4.mp4
          cat chain.txt; rm raw.mp4 chain.txt
      - name: breakdown, sheets, loudness
        run: |
          cd out
          F=FansaChat_P05_v5_test2_5x4.mp4
          ffmpeg -v error -y -i $F -i P05_v5_test2_draft.mp4 -filter_complex "[0:v]scale=676:540[a];[1:v]scale=676:540[b];[a][b]vstack" -map 0:a -c:v libx264 -crf 18 -pix_fmt yuv420p P05_v5_test2_breakdown.mp4
          ffmpeg -v error -y -i $F -vf "fps=12,scale=338:-1,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=14:fontcolor=yellow:box=1:boxcolor=black@0.5,tile=6x9" -frames:v 1 P05_v5_test2_sheet12.jpg
          ffmpeg -v error -y -i $F -vf "select='eq(n\,10)+eq(n\,20)+eq(n\,27)+eq(n\,31)+eq(n\,45)+eq(n\,55)+eq(n\,66)+eq(n\,80)+eq(n\,95)+eq(n\,108)+eq(n\,117)+eq(n\,121)+eq(n\,126)+eq(n\,134)',scale=675:-1,drawtext=text='f%{n}':x=8:y=8:fontsize=22:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=4x4" -vsync vfr -frames:v 1 P05_v5_test2_keys.jpg
          ffmpeg -hide_banner -i $F -af ebur128=peak=true -f null - 2>&1 | tail -12 > loudness.txt
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact $F > probe.txt
          cat probe.txt loudness.txt >> $GITHUB_STEP_SUMMARY; ls -la
      - uses: actions/upload-artifact@v4
        with: { name: 'P05_v5_test2', path: out/, retention-days: 30 }
      - name: publish to Pages /p05_test2/
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp -r out /tmp/out
          for i in 1 2 3 4 5; do
            git fetch -q origin gh-pages && git checkout -qf -B gh-pages origin/gh-pages
            rm -rf p05_test2 && mkdir -p p05_test2 && cp /tmp/out/*.mp4 /tmp/out/*.jpg /tmp/out/*.txt p05_test2/
            {
              echo '<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>P05 test shot 2</title>'
              echo '<style>body{background:#0c0b11;color:#e9e6f2;font:16px system-ui;margin:24px}video,img{max-width:100%;border-radius:10px;margin:8px 0}</style>'
              echo "<h2>P05 v5 - test shot 2 (5:4) - run ${{ github.run_id }}</h2>"
              echo '<video src="./FansaChat_P05_v5_test2_5x4.mp4" controls playsinline loop width=675></video>'
              echo '<h3>Breakdown: final over B/W draft</h3><video src="./P05_v5_test2_breakdown.mp4" controls playsinline loop width=675></video>'
              echo '<h3>Key frames</h3><img src="./P05_v5_test2_keys.jpg"><h3>12 fps sheet</h3><img src="./P05_v5_test2_sheet12.jpg">'
              echo '<h3>Loudness</h3><pre>'; cat /tmp/out/loudness.txt; echo '</pre>'
            } > p05_test2/index.html
            git add p05_test2 && git commit -qm "Pages: P05 v5 test shot 2 (run ${{ github.run_id }})" && git push -q origin gh-pages && break
            sleep $((i * 5))
          done
